name: studysky-dev

services:
  postgres:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_DB: studysky
      POSTGRES_USER: studysky
      POSTGRES_PASSWORD: studysky
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_dev:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U studysky -d studysky']
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: node:24.18.0-bookworm-slim
    working_dir: /app
    command: ['sh', '-c', 'npm ci && npm run dev -- --host 0.0.0.0']
    environment:
      DATABASE_URL: postgresql://studysky:studysky@postgres:5432/studysky
      ORIGIN: http://localhost:5173
      STORAGE_ROOT: /data/uploads
    ports:
      - '127.0.0.1:5173:5173'
    volumes:
      - .:/app
      - node_modules_dev:/app/node_modules
      - uploads_dev:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_dev:
  node_modules_dev:
  uploads_dev:

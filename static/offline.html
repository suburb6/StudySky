<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f7f5" />
    <title>Offline · StudySky</title>
    <style>
      :root {
        font-family:
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        color: #37352f;
        background: #f7f7f5;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        width: min(100%, 420px);
        padding: 28px;
        border: 1px solid #e7e7e5;
        border-radius: 10px;
        background: white;
        box-sizing: border-box;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 25px;
        letter-spacing: -0.02em;
      }
      p {
        color: #6f6e69;
        line-height: 1.55;
      }
      button {
        min-height: 42px;
        padding: 8px 13px;
        border: 0;
        border-radius: 7px;
        color: white;
        background: #37352f;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>
        StudySky kept its shell available. Pending scans and task drafts remain on this device and
        are not marked uploaded until the server confirms them.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_DB: studysky_release
          POSTGRES_USER: studysky
          POSTGRES_PASSWORD: studysky
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studysky -d studysky_release"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: 'true'
      DATABASE_URL: postgresql://studysky:studysky@127.0.0.1:5432/studysky_release
      TEST_DATABASE_URL: postgresql://studysky:studysky@127.0.0.1:5432/studysky_release
      STORAGE_ROOT: ${{ github.workspace }}/data/release-uploads
      DISABLE_BACKGROUND_JOBS: 'true'
      ADMIN_EMAIL: release@example.test
      ADMIN_PASSWORD: release-password-123
      ADMIN_TIMEZONE: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate semantic version tag
        run: echo "${GITHUB_REF_NAME}" | grep --extended-regexp --quiet '^v[0-9]+\.[0-9]+\.[0-9]+$'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Match package version to the release tag
        run: node --eval "if ('v' + require('./package.json').version !== process.env.GITHUB_REF_NAME) process.exit(1)"
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run verify

  images:
    name: Image (${{ matrix.variant }})
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
          - variant: base
            dockerfile: Dockerfile
            target: final
            suffix: ''
          - variant: ocr
            dockerfile: Dockerfile
            target: ocr-runtime
            suffix: '-ocr'
          - variant: formula
            dockerfile: Dockerfile.formula
            target: formula-runtime
            suffix: '-formula'
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: write
      attestations: write
    env:
      IMAGE: ghcr.io/suburb6/studysky
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish both architectures
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.source=https://github.com/suburb6/StudySky
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
      - name: Attest published manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign manifest with GitHub OIDC
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Scan published amd64 image
        env:
          TRIVY_PLATFORM: linux/amd64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.ref_name }}${{ matrix.suffix }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Scan published arm64 image
        env:
          TRIVY_PLATFORM: linux/arm64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.ref_name }}${{ matrix.suffix }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}:${{ github.ref_name }}${{ matrix.suffix }}
          artifact-name: studysky-${{ github.ref_name }}-${{ matrix.variant }}.spdx.json
          output-file: studysky-${{ github.ref_name }}-${{ matrix.variant }}.spdx.json
          format: spdx-json
          upload-artifact: true
          upload-release-assets: false

  released-image-smoke:
    name: Verify published images
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      attestations: read
      contents: read
      id-token: write
      packages: read
    env:
      ADMIN_EMAIL: release-smoke@example.test
      ADMIN_PASSWORD: release-smoke-password-123
      ADMIN_NAME: Release smoke owner
      ADMIN_TIMEZONE: UTC
      ORIGIN: http://127.0.0.1:3000
      POSTGRES_PASSWORD: release-smoke-database-password
      SETTINGS_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      STUDYSKY_VERSION: ${{ github.ref_name }}
      IMAGE: ghcr.io/suburb6/studysky
      FORMULA_OCR_TOKEN: formula-release-token-000000000000000000000000000000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify architectures, signatures, and provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for suffix in '' '-ocr' '-formula'; do
            reference="${IMAGE}:${GITHUB_REF_NAME}${suffix}"
            manifest="$(docker buildx imagetools inspect --raw "${reference}")"
            jq --exit-status '[.manifests[].platform | select(.os == "linux") | .architecture] | index("amd64") != null and index("arm64") != null' <<<"${manifest}"
            cosign verify \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${reference}"
            gh attestation verify "oci://${reference}" --repo "${GITHUB_REPOSITORY}"
          done
      - name: Verify blank install from the published base image
        run: CONTAINER_SMOKE_RELEASE_IMAGE=true bash scripts/container-smoke.sh
      - name: Verify formula recognition in the published image
        run: bash scripts/formula-container-smoke.sh
      - name: Stop verification containers
        if: always()
        run: docker compose -f compose.yml -f compose.formula.yml down --volumes --remove-orphans

  publish:
    name: Publish GitHub release
    needs: [images, released-image-smoke]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: studysky-${{ github.ref_name }}-*.spdx.json
          path: release-assets
          merge-multiple: true
      - name: Create source archives and checksums
        run: |
          git archive --format=tar.gz --prefix="studysky-${GITHUB_REF_NAME}/" --output="release-assets/studysky-${GITHUB_REF_NAME}.tar.gz" HEAD
          git archive --format=zip --prefix="studysky-${GITHUB_REF_NAME}/" --output="release-assets/studysky-${GITHUB_REF_NAME}.zip" HEAD
          cd release-assets
          sha256sum studysky-* > SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/SHA256SUMS
            release-assets/studysky-*.tar.gz
            release-assets/studysky-*.zip
            release-assets/studysky-*.spdx.json

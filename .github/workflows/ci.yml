name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_DB: studysky_test
          POSTGRES_USER: studysky
          POSTGRES_PASSWORD: studysky
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studysky -d studysky_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: 'true'
      DATABASE_URL: postgresql://studysky:studysky@127.0.0.1:5432/studysky_test
      TEST_DATABASE_URL: postgresql://studysky:studysky@127.0.0.1:5432/studysky_test
      POSTGRES_PASSWORD: studysky
      STORAGE_ROOT: ${{ github.workspace }}/data/test-uploads
      DISABLE_BACKGROUND_JOBS: 'true'
      E2E_ADMIN_EMAIL: e2e@example.test
      E2E_ADMIN_PASSWORD: e2e-password-123
      ADMIN_EMAIL: e2e@example.test
      ADMIN_PASSWORD: e2e-password-123
      ADMIN_NAME: E2E owner
      ADMIN_TIMEZONE: UTC
      ORIGIN: http://127.0.0.1:4173
      FORMULA_OCR_TOKEN: formula-ci-token-0000000000000000000000000000000000
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: python -m unittest formula-service/test_server.py
      - name: Validate release and source Compose definitions
        run: |
          docker compose config --quiet
          docker compose -f compose.yml -f compose.build.yml config --quiet
          docker compose -f compose.yml -f compose.ocr.yml config --quiet
          docker compose -f compose.yml -f compose.build.yml -f compose.ocr-build.yml config --quiet
          docker compose -f compose.yml -f compose.formula.yml config --quiet
          docker compose -f compose.yml -f compose.formula.yml -f compose.formula-build.yml config --quiet
      - name: Build production container
        run: docker build --target final --tag studysky:ci .
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Verify blank install, persistence, backup, and restore
        run: bash scripts/container-smoke.sh
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Stop verification containers
        if: always()
        run: docker compose -f compose.yml -f compose.build.yml down --volumes --remove-orphans

  formula-image:
    name: Formula image
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      FORMULA_OCR_TOKEN: formula-ci-token-0000000000000000000000000000000000
      ORIGIN: http://127.0.0.1:3000
      POSTGRES_PASSWORD: formula-ci-database-password
      STUDYSKY_VERSION: test
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the service boundary
        run: python -m unittest formula-service/test_server.py
      - name: Build the optional formula image
        run: docker build --file Dockerfile.formula --target formula-runtime --tag studysky-formula:local .
      - name: Convert a handwriting-style formula with the real model
        run: FORMULA_SMOKE_SOURCE_BUILD=true bash scripts/formula-container-smoke.sh
      - name: Stop formula verification container
        if: always()
        run: docker compose -f compose.yml -f compose.formula.yml -f compose.formula-build.yml down --volumes --remove-orphans

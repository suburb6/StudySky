version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      codeql:
        patterns: ['github/codeql-action/*']
  - package-ecosystem: pip
    directory: /formula-service
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
